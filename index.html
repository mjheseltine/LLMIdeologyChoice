<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identify the LLM</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1d2939;background:#fff}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:920px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#475467;font-size:14px}.progress{height:7px;background:#e9edf3;border-radius:10px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;width:0;background:#4256d6;transition:width .2s}h1{font-size:clamp(21px,3vw,27px);line-height:1.25;margin:0 0 8px}p.help{color:#475467;margin:0 0 20px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile{font:inherit;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;min-height:210px;border:3px solid transparent;border-radius:16px;padding:22px;line-height:1.55;color:#17202e;transition:border-color .15s,box-shadow .15s,transform .15s}.tile:nth-child(1){background:#e8f1ff}.tile:nth-child(2){background:#f1eafa}.tile:hover{box-shadow:0 4px 16px #00000014}.tile:focus-visible{outline:3px solid #182c8b;outline-offset:3px}.tile.selected{border-color:#1f42cc;box-shadow:0 0 0 2px #1f42cc22}.tile .tag{display:block;font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}.tile .tick{display:none;margin-top:18px;font-weight:700;color:#1f42cc}.tile.selected .tick{display:block}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}.hint{color:#667085;font-size:13px}.next{border:0;background:#2449ce;color:white;font:inherit;font-weight:700;padding:12px 28px;border-radius:10px;cursor:pointer}.next:disabled{background:#aeb8d0;cursor:not-allowed}.done{padding:45px 20px;text-align:center;background:#f5f7ff;border-radius:16px}.error{background:#fff0f0;color:#8d1515;padding:18px;border-radius:10px}@media(max-width:650px){.tiles{grid-template-columns:1fr}.tile{min-height:130px}.bottom{align-items:flex-start}}
</style>
</head>
<body><main class="wrap" id="app" aria-live="polite"></main>
<script>
/* Replace the sample text below with your actual Claude and Grok responses.
   Keep each id unique and DO NOT include model names inside the response text. */
const PAIRS = [
 {id:'q1',question:'What are the main arguments for and against raising income taxes?',claude:'[Paste Claude answer to question 1 here]',grok:'[Paste Grok answer to question 1 here]'},
 {id:'q2',question:'What are the main arguments for and against stricter immigration policies?',claude:'[Paste Claude answer to question 2 here]',grok:'[Paste Grok answer to question 2 here]'},
 {id:'q3',question:'How should governments approach climate change policy?',claude:'[Paste Claude answer to question 3 here]',grok:'[Paste Grok answer to question 3 here]'},
 {id:'q4',question:'What are the trade-offs of expanding public healthcare?',claude:'[Paste Claude answer to question 4 here]',grok:'[Paste Grok answer to question 4 here]'},
 {id:'q5',question:'What are the arguments for and against regulating social media platforms?',claude:'[Paste Claude answer to question 5 here]',grok:'[Paste Grok answer to question 5 here]'},
 {id:'q6',question:'What are the major trade-offs in increasing defense spending?',claude:'[Paste Claude answer to question 6 here]',grok:'[Paste Grok answer to question 6 here]'},
 {id:'q7',question:'What are the arguments for and against lowering the voting age?',claude:'[Paste Claude answer to question 7 here]',grok:'[Paste Grok answer to question 7 here]'},
 {id:'q8',question:'How should governments balance free speech and misinformation concerns?',claude:'[Paste Claude answer to question 8 here]',grok:'[Paste Grok answer to question 8 here]'}
];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const trials=shuffle(PAIRS).map(p=>({...p,leftModel:Math.random()<.5?'grok':'claude'}));
let index=0,choice=null,shownAt=0;const results=[];const app=document.getElementById('app');
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function render(){choice=null;app.replaceChildren();if(index===trials.length){finish();return}const t=trials[index];const top=el('div','top');top.append(el('span','',`Question ${index+1} of ${trials.length}`),el('span','','Which response is from Grok?'));app.append(top);const prog=el('div','progress'),bar=el('div','bar');bar.style.width=`${100*index/trials.length}%`;prog.append(bar);app.append(prog);app.append(el('h1','',t.question),el('p','help','Read both responses, then select the one you think was generated by Grok.'));const tiles=el('div','tiles');const next=el('button','next',index===trials.length-1?'Finish':'Next');next.disabled=true;next.type='button';for(const side of ['left','right']){const model=side==='left'?t.leftModel:(t.leftModel==='grok'?'claude':'grok');const b=el('button','tile');b.type='button';b.setAttribute('aria-pressed','false');b.append(el('span','tag',side==='left'?'Response A':'Response B'),el('span','',t[model]),el('span','tick','✓ Selected as Grok'));b.addEventListener('click',()=>{choice=side;[...tiles.children].forEach(z=>{z.classList.remove('selected');z.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');next.disabled=false});tiles.append(b)}app.append(tiles);const bottom=el('div','bottom');bottom.append(el('span','hint','You can change your selection before clicking Next.'),next);app.append(bottom);shownAt=performance.now();next.addEventListener('click',()=>{if(!choice)return;const selectedModel=choice===t.leftModel?'grok':'claude';results.push({id:t.id,order:index+1,selected_side:choice,grok_side:t.leftModel,selected_model:selectedModel,correct:Number(selectedModel==='grok'),rt_ms:Math.round(performance.now()-shownAt)});index++;render()})}
function finish(){const correct=results.reduce((s,r)=>s+r.correct,0);const payload={type:'llmExperimentComplete',version:1,results,score:correct,total:trials.length};try{window.parent.postMessage(payload,'*')}catch(e){}const done=el('div','done');done.append(el('h1','','All eight comparisons are complete.'),el('p','','Your selections have been recorded. Please continue with the survey.'));app.append(done);}
if(PAIRS.length!==8||new Set(PAIRS.map(p=>p.id)).size!==8){app.append(el('p','error','Configuration error: provide exactly eight uniquely identified pairs.'))}else{render()}
</script></body></html>
